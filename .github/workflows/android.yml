name: Build APK

# 폰만으로 앱을 설치할 수 있도록, 클라우드에서 빌드해 Release 에 APK 를 올린다.
# PC 에 Android Studio 를 설치하지 않아도 된다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 준비
        uses: android-actions/setup-android@v3

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4

      - name: 단위 테스트
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # 인증키는 APK 에 넣지 않는다.
      # 공개 저장소의 Release 에서 누구나 내려받을 수 있으므로, 키가 박히면 그대로 유출된다.
      # 사용자는 앱 안의 "인증키 설정" 화면에서 본인 키를 입력한다.
      - name: 디버그 APK 빌드
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: apt-price-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    # main 에 반영된 것만 Release 로 올린다. PR 빌드는 아티팩트까지만.
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: APK 내려받기
        uses: actions/download-artifact@v4
        with:
          name: apt-price-debug-apk
          path: apk

      - name: 최신 빌드 Release 갱신
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mv apk/*.apk apk/apt-price-debug.apk
          NOTES=$(cat <<'MD'
          폰에서 바로 설치할 수 있는 디버그 APK 입니다.

          ### 설치 방법
          1. 폰 브라우저로 아래 `apt-price-debug.apk` 를 내려받습니다.
          2. 다운로드한 파일을 탭해 설치합니다.
             "출처를 알 수 없는 앱" 허용을 물어보면 허용해 주세요.
             이미 깔려 있으면 그 위에 덮어쓰기로 설치됩니다.
             (2026-09-04 이전 버전이 깔려 있다면 그때는 서명이 달라
              한 번만 기존 앱을 지우고 설치해야 합니다)
          3. 앱을 열고 우측 상단 **설정(톱니바퀴)** 에서 공공데이터포털
             **일반 인증키(Decoding)** 를 입력합니다.

          ### 인증키에 대하여
          이 APK 에는 인증키가 들어 있지 않습니다. 각자 발급받은 키를 앱에 입력해서
          쓰는 방식이라, 공개된 APK 를 통해 남의 키가 유출되지 않습니다.
          입력한 키는 기기에만 저장되며 외부로 전송되지 않습니다.

          발급: data.go.kr → "국토교통부_아파트 매매 실거래가 자료" 와
          "국토교통부_아파트 전월세 자료" 활용신청 → 마이페이지에서 Decoding 키 복사
          MD
          )
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest apk/apt-price-debug.apk \
            --title "최신 빌드 (${GITHUB_SHA::7})" \
            --notes "$NOTES" \
            --latest
